<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיפוש ערכים בקובץ CSV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f7f4eb; /* צבע חול בהיר מאוד ברקע הכללי */
            color: #4a3e3d; /* צבע טקסט חום-אפרפר כהה לקריאות מקסימלית */
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fffdf9; /* צבע שמנת חם לרקע התיבה */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(180, 165, 140, 0.15); /* צל רך בגוון חול */
            border: 1px solid #e8dec9; /* מסגרת עדינה בגוון מדברי */
        }
        h2 {
            color: #705e49; /* חום אדמה רך לכותרת */
            margin-top: 0;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #d9ccb4; /* מסגרת תיבת הטקסט בגוון חול */
            border-radius: 6px;
            font-size: 16px;
            background-color: #faf7f0; /* רקע פנימי רך לתיבת החיפוש */
            color: #4a3e3d;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #bfae93; /* הדגשת המסגרת בפוקוס לחום-זהוב */
            box-shadow: 0 0 5px rgba(191, 174, 147, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ebdcb9; /* גבולות תאים בצבע חול בהיר */
            padding: 14px;
            text-align: right;
        }
        th {
            background-color: #efe6cf; /* כותרת הטבלה בגוון חול מובהק אך רך */
            color: #61503b;
            font-weight: bold;
        }
        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        /* אפקט מעבר עכבר בגוון חול-שמנת עשיר */
        tbody tr:hover {
            background-color: #f3ebda; 
        }
        .status {
            color: #8c7b64; /* טקסט סטטוס בחום בהיר */
            font-style: italic;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>חיפוש ערכים מתוך קובץ CSV</h2>
    <div id="status" class="status">טוען נתונים...</div>
    
    <input type="text" id="searchInput" placeholder="הקלד כאן כדי לחפש..." disabled>
    
    <table id="resultsTable">
        <thead>
            <tr>
                <th>תוצאות החיפוש</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const csvUrl = 'DATA.CSV'; // נתיב לקובץ ה-CSV שלך
    let csvData = [];

    // פונקציה לפירוק שורת CSV למערך
    function parseCSVRow(text) {
        let p = '', r = [];
        let q = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { q = !q; }
            else if (c === ',' && !q) { r.push(p.trim()); p = ''; }
            else { p += c; }
        }
        r.push(p.trim());
        return r;
    }

    // חיתוך לפי המנגנון הישן והפשוט
    function limitToTenWords(text) {
        const words = text.split(/\s+/).filter(w => w.length > 0);
        if (words.length > 10) {
            return words.slice(0, 10).join(' ') + '...';
        }
        return text;
    }

    // טעינת הקובץ מהשרת
    fetch(csvUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error('לא ניתן למצוא את הקובץ DATA.CSV או שקיימת שגיאת הרשאות');
            }
            return response.text();
        })
        .then(text => {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return;

            // שמירת הנתונים ללא שורת הכותרות
            csvData = lines.slice(1).map(line => parseCSVRow(line));

            // הפעלת תיבת החיפוש
            document.getElementById('status').innerText = `הנתונים נטענו בהצלחה. הקלד כדי לחפש.`;
            const searchInput = document.getElementById('searchInput');
            searchInput.disabled = false;
            searchInput.addEventListener('input', filterData);
        })
        .catch(error => {
            document.getElementById('status').innerText = 'שגיאה: ' + error.message;
            document.getElementById('status').style.color = '#b33939'; // צבע שגיאה מותאם בגוון טרקוטה/חמרה
        });

    // הצגת התאים שנמצאו בטבלה
    function renderResults(results) {
        const body = document.getElementById('tableBody');
        body.innerHTML = ''; // ניקוי הטבלה
        
        if (results.length === 0) {
            body.innerHTML = `<tr><td style="text-align:center; color:#a69580;">לא נמצאו תוצאות מתאימות</td></tr>`;
            return;
        }
        
        results.forEach(item => {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            
            td.textContent = limitToTenWords(item.matchedText); 
            tr.appendChild(td);
            
            // הפניה לקישור שבעמודה השנייה (אינדקס 1)
            tr.addEventListener('click', () => {
                const url = item.originalRow[1]; 
                if (url) {
                    window.location.href = url;
                } else {
                    alert('לא נמצא קישור תואם עבור תוצאה זו');
                }
            });
            
            body.appendChild(tr);
        });
    }

    // סינון ובניית רשימת התאים המתאימים
    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        
        if (query === '') {
            renderResults([]);
            return;
        }
        
        const matchedItems = [];
        
        csvData.forEach(row => {
            row.forEach((cell, index) => {
                // התעלמות מעמודת הקישור עצמה בזמן החיפוש
                if (index === 1) return; 

                if (cell.toLowerCase().includes(query)) {
                    matchedItems.push({
                        matchedText: cell,   
                        originalRow: row     
                    });
                }
            });
        });
        
        renderResults(matchedItems);
    }
</script>

</body>
</html>
