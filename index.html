<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Search Engine</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        body {
            margin: 0;
            padding: 28px clamp(12px, 3.7vw, 56px);
            background: linear-gradient(135deg, #f3ede2 0%, #e7decb 100%);
            color: #4a3e3d;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fffdf9;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(135, 120, 95, 0.15);
            border: 1px solid rgba(232, 222, 201, 0.6);
        }
        h2 {
            color: #705e49;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }
        .status {
            color: #8c7b64;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 24px;
            border: 1px solid #d9ccb4;
            border-radius: 10px;
            font-size: 16px;
            background-color: #faf7f0;
            color: #4a3e3d;
            outline: none;
            text-align: left;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #bfae93;
            box-shadow: 0 0 0 3px rgba(191, 174, 147, 0.25);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ebdcb9;
            padding: 14px 16px;
            text-align: left;
        }
        th {
            background-color: #efe6cf;
            color: #61503b;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }
        tbody tr {
            cursor: pointer;
            transition: background-color 0.18s;
        }
        tbody tr:hover {
            background-color: #f3ebda; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Search Data from CSV</h2>
    <div id="status" class="status">Loading site data...</div>
    
    <input type="text" id="searchInput" placeholder="Type here to search...">
    
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Search Results</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const csvUrl = 'DATA.CSV'; 
    let csvData = [];
    const searchInput = document.getElementById('searchInput');

    // מנגנון חדש: קורא את מילת החיפוש ישירות מתוך הסולמית (#) בכתובת האתר
    function getQueryFromHash() {
        const hash = window.location.hash; // מחזיר למשל: #wiki או #WIKIPEDIA
        if (hash && hash.length > 1) {
            return decodeURIComponent(hash.substring(1)).trim(); // מסיר את סימן ה-# ומפענח
        }
        return '';
    }

    // 1. שתילת הערך בתיבה מהסולמית מיד עם עליית הדף (עוקף שרת לחלוטין)
    const initialQuery = getQueryFromHash();
    if (initialQuery) {
        searchInput.value = initialQuery;
    }

    function cleanString(str) {
        if (!str) return '';
        return str.toString().replace(/[\r\n]+/g, ' ').replace(/[\s\u200B\u00A0]+/g, ' ').trim();
    }

    function parseCSVRow(text) {
        let p = '', r = [];
        let q = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { q = !q; }
            else if (c === ',' && !q) { r.push(cleanString(p)); p = ''; }
            else { p += c; }
        }
        r.push(cleanString(p));
        return r;
    }

    function limitToTenWords(text) {
        const words = text.split(/\s+/).filter(w => w.length > 0);
        if (words.length > 10) {
            return words.slice(0, 10).join(' ') + '...';
        }
        return text;
    }

    function containsUrl(text) {
        const lowerText = text.toLowerCase();
        return lowerText.includes('http://') || 
               lowerText.includes('https://') || 
               lowerText.includes('wikipedia.org') ||
               lowerText.includes('.org') ||
               lowerText.includes('.com');
    }

    function extractRealUrl(rowArray) {
        const urlRegex = /(https?:\/\/[^\s|]+)/i;
        for (let i = 0; i < rowArray.length; i++) {
            const cell = rowArray[i];
            const match = cell.match(urlRegex);
            if (match) {
                return match.trim();
            }
        }
        return null;
    }

    // 2. טעינת קובץ הנתונים מהשרת
    fetch(csvUrl)
        .then(response => {
            if (!response.ok) throw new Error('DATA.CSV not found');
            return response.text();
        })
        .then(text => {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return;

            csvData = lines.slice(1).map(line => parseCSVRow(line));
            document.getElementById('status').innerText = `Data loaded successfully.`;
            
            // האזנה להקלדות ידניות ועדכון הסולמית בהתאם
            searchInput.addEventListener('input', () => {
                filterData();
                updateURLHash(searchInput.value);
            });

            // 3. הפעלת החיפוש האוטומטי אם נשתל ערך מהסולמית
            if (searchInput.value) {
                filterData();
            }
        })
        .catch(error => {
            document.getElementById('status').innerText = 'Error: ' + error.message;
            document.getElementById('status').style.color = '#b33939'; 
        });

    function renderResults(results) {
        const body = document.getElementById('tableBody');
        body.innerHTML = ''; 
        
        if (results.length === 0) {
            body.innerHTML = `<tr><td style="text-align:center; color:#a69580;">No matching results found</td></tr>`;
            return;
        }
        
        results.forEach(item => {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            
            td.textContent = limitToTenWords(item.matchedText); 
            tr.appendChild(td);
            
            tr.addEventListener('click', () => {
                const finalUrl = extractRealUrl(item.originalRow);
                if (finalUrl) {
                    window.location.href = finalUrl;
                } else {
                    alert('No valid link found for this result');
                }
            });
            
            body.appendChild(tr);
        });
    }

    function filterData() {
        const query = cleanString(searchInput.value).toLowerCase();
        
        if (query === '') {
            renderResults([]);
            return;
        }
        
        const matchedItems = [];
        
        csvData.forEach(row => {
            row.forEach((cell) => {
                if (containsUrl(cell)) return; 

                if (cell.toLowerCase().includes(query)) {
                    matchedItems.push({
                        matchedText: cell,   
                        originalRow: row     
                    });
                }
            });
        });
        
        renderResults(matchedItems);
    }

    // מעדכן את הסולמית בכתובת האתר בזמן ההקלדה ללא רענון עמוד
    function updateURLHash(query) {
        const cleanQuery = cleanString(query);
        if (cleanQuery !== '') {
            window.history.replaceState({}, '', '#' + cleanQuery); 
        } else {
            window.history.replaceState({}, '', window.location.pathname); // מנקה את הסולמית אם ריק
        }
    }
</script>

</body>
</html>
