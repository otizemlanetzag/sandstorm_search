<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Search Engine</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        body {
            margin: 0;
            padding: 28px clamp(12px, 3.7vw, 56px);
            background: linear-gradient(135deg, #f3ede2 0%, #e7decb 100%); /* Elegant sand gradient background */
            color: #4a3e3d; /* Soft dark brown text */
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fffdf9; /* Soft cream container */
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(135, 120, 95, 0.15); /* Delicate warm shadow */
            border: 1px solid rgba(232, 222, 201, 0.6);
        }
        h2 {
            color: #705e49; /* Earthy clay tone */
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }
        .status {
            color: #8c7b64;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 24px;
            border: 1px solid #d9ccb4;
            border-radius: 10px;
            font-size: 16px;
            background-color: #faf7f0;
            color: #4a3e3d;
            outline: none;
            text-align: left;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #bfae93;
            box-shadow: 0 0 0 3px rgba(191, 174, 147, 0.25);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ebdcb9;
            padding: 14px 16px;
            text-align: left;
        }
        th {
            background-color: #efe6cf; /* Sandy header */
            color: #61503b;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tbody tr {
            cursor: pointer;
            transition: background-color 0.18s;
        }
        tbody tr:hover {
            background-color: #f3ebda; /* Soft warm selection pulse */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Search Data from CSV</h2>
    <div id="status" class="status">Initializing connection...</div>
    
    <input type="text" id="searchInput" placeholder="Type here to search..." disabled>
    
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Search Results</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const csvUrl = 'DATA.CSV'; 
    let csvData = [];

    // Helper function to thoroughly scrub layout breaks and phantom syntax
    function cleanString(str) {
        if (!str) return '';
        return str.toString()
                  .replace(/[\r\n]+/g, ' ') 
                  .replace(/[\s\u200B\u00A0]+/g, ' ') 
                  .trim();
    }

    function parseCSVRow(text) {
        let p = '', r = [];
        let q = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { q = !q; }
            else if (c === ',' && !q) { r.push(cleanString(p)); p = ''; }
            else { p += c; }
        }
        r.push(cleanString(p));
        return r;
    }

    function limitToTenWords(text) {
        const words = text.split(/\s+/).filter(w => w.length > 0);
        if (words.length > 10) {
            return words.slice(0, 10).join(' ') + '...';
        }
        return text;
    }

    function containsUrl(text) {
        const lowerText = text.toLowerCase();
        return lowerText.includes('http://') || 
               lowerText.includes('https://') || 
               lowerText.includes('wikipedia.org') ||
               lowerText.includes('.org') ||
               lowerText.includes('.com');
    }

    function extractRealUrl(rowArray) {
        const urlRegex = /(https?:\/\/[^\s|]+)/i;
        for (let i = 0; i < rowArray.length; i++) {
            const cell = rowArray[i];
            const match = cell.match(urlRegex);
            if (match) {
                return match[0].trim();
            }
        }
        return null;
    }

    // Execution Engine triggered strictly upon secure content fetch
    fetch(csvUrl)
        .then(response => {
            if (!response.ok) throw new Error('DATA.CSV footprint missing or denied access');
            return response.text();
        })
        .then(text => {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return;

            csvData = lines.slice(1).map(line => parseCSVRow(line));

            document.getElementById('status').innerText = `Data matrix loaded. Type to sort records.`;
            const searchInput = document.getElementById('searchInput');
            searchInput.disabled = false;
            
            searchInput.addEventListener('input', () => {
                filterData();
                updateURLQuery(searchInput.value);
            });

            // Run parameter validation only when local dataset array compilation completes
            checkURLQuery();
        })
        .catch(error => {
            document.getElementById('status').innerText = 'System Fault: ' + error.message;
            document.getElementById('status').style.color = '#b33939'; 
        });

    function renderResults(results) {
        const body = document.getElementById('tableBody');
        body.innerHTML = ''; 
        
        if (results.length === 0) {
            body.innerHTML = `<tr><td style="text-align:center; color:#a69580;">No records map to your query</td></tr>`;
            return;
        }
        
        results.forEach(item => {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            
            td.textContent = limitToTenWords(item.matchedText); 
            tr.appendChild(td);
            
            tr.addEventListener('click', () => {
                const finalUrl = extractRealUrl(item.originalRow);
                if (finalUrl) {
                    window.location.href = finalUrl;
                } else {
                    alert('No navigation pointer assigned to this row');
                }
            });
            
            body.appendChild(tr);
        });
    }

    function filterData() {
        const query = cleanString(document.getElementById('searchInput').value).toLowerCase();
        
        if (query === '') {
            renderResults([]);
            return;
        }
        
        const matchedItems = [];
        
        csvData.forEach(row => {
            row.forEach((cell) => {
                if (containsUrl(cell)) return; 

                if (cell.toLowerCase().includes(query)) {
                    matchedItems.push({
                        matchedText: cell,   
                        originalRow: row     
                    });
                }
            });
        });
        
        renderResults(matchedItems);
    }

    // Reliable URL Parameter parsing matrix matching the pattern directly
    function checkURLQuery() {
        const currentQueryString = window.location.search;
        const urlParams = new URLSearchParams(currentQueryString);
        
        // Dynamic validation accepting both configurations (?q= and ?Q=)
        let rawQuery = urlParams.get('q') || urlParams.get('Q');
        
        if (rawQuery) {
            const parsedQuery = cleanString(decodeURIComponent(rawQuery));
            const searchInput = document.getElementById('searchInput');
            
            if (searchInput) {
                searchInput.value = parsedQuery;
                filterData();
                updateURLQuery(parsedQuery);
            }
        }
    }

    function updateURLQuery(query) {
        const url = new URL(window.location.href);
        const cleanQuery = cleanString(query);
        if (cleanQuery !== '') {
            url.searchParams.set('q', cleanQuery); 
        } else {
            url.searchParams.delete('q'); 
            url.searchParams.delete('Q'); 
        }
        window.history.replaceState({}, '', url);
    }
</script>

</body>
</html>
