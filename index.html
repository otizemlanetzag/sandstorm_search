<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sandstorm Search</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f7f4eb; color: #4a3e3d; }
    .container { width: min(100%, 760px); margin: 32px auto; padding: clamp(18px, 4vw, 28px); background: #fffdf9; border: 1px solid #e8dec9; border-radius: 14px; box-shadow: 0 4px 18px #b4a58c22; }
    h1 { margin: 0 0 18px; color: #705e49; font-size: clamp(1.35rem, 4vw, 1.8rem); }
    #searchInput { display: block; width: 100%; min-width: 0; padding: 13px 14px; margin: 0 0 14px; border: 1px solid #d9ccb4; border-radius: 7px; background: #faf7f0; color: inherit; font-size: 16px; }
    #searchInput:focus { outline: 2px solid #bfae93; outline-offset: 2px; }
    .status { margin: 0 0 14px; color: #786b59; font-size: 14px; }
    .results { display: grid; gap: 9px; }
    .result { display: block; width: 100%; padding: 14px; border: 1px solid #ebdcb9; border-radius: 8px; color: inherit; background: #fffdf9; text-align: left; overflow-wrap: anywhere; cursor: pointer; }
    .result:hover, .result:focus-visible { background: #f3ebda; outline-color: #9b815e; }
    .result-title { display: block; font-weight: 700; margin-bottom: 5px; }
    .result-url { display: block; color: #6c7956; font-size: 13px; }
    .empty { padding: 18px; text-align: center; color: #8a7a64; border: 1px dashed #ebdcb9; border-radius: 8px; }
    @media (max-width: 480px) { body { padding: 12px; } .container { margin: 10px auto; } }
  </style>
</head>
<body>
  <main class="container">
    <h1>Sandstorm Search</h1>
    <p id="status" class="status" role="status" aria-live="polite">Loading search data…</p>
    <label for="searchInput" class="sr-only"></label>
    <input id="searchInput" type="search" placeholder="Type here to search…" autocomplete="off" disabled>
    <section id="results" class="results" aria-label="Search results"></section>
  </main>
  <script>
    'use strict';
    // Keep DATA.CSV beside this page. CSV is parsed as a complete document so quoted
    // commas, escaped quotes, and newlines inside quoted fields are handled correctly.
    const csvUrl = new URL('./DATA.CSV', window.location.href);
    const searchInput = document.getElementById('searchInput');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    let csvData = [];
    let debounceTimer;

    function cleanString(value) {
      return String(value ?? '').replace(/[\u200B\u00A0]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (ch === '"') quoted = false;
          else field += ch;
        } else if (ch === '"' && field.length === 0) {
          quoted = true;
        } else if (ch === ',') {
          row.push(field); field = '';
        } else if (ch === '\n') {
          row.push(field); rows.push(row); row = []; field = '';
        } else if (ch !== '\r') {
          field += ch;
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows.map(r => r.map(cleanString)).filter(r => r.some(Boolean));
    }

    function getSafeUrl(row) {
      for (const cell of row) {
        const candidate = cell.trim();
        // Accept explicit HTTP(S) URLs only; never navigate to javascript: or data: URLs.
        const match = candidate.match(/https?:\/\/[^\s"'<>]+/i);
        if (!match) continue;
        try {
          const url = new URL(match[0].replace(/[),.;]+$/, ''));
          if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
        } catch (_) { /* Ignore malformed URLs and continue checking cells. */ }
      }
      return null;
    }

    function displayText(row) {
      const url = getSafeUrl(row);
      const searchable = row.filter(cell => !/^https?:\/\//i.test(cell.trim()));
      const text = searchable.find(cell => cleanString(cell)) || row.find(Boolean) || 'Untitled result';
      return { title: text.split(/\s+/).slice(0, 12).join(' ') + (text.split(/\s+/).length > 12 ? '…' : ''), url };
    }

    function renderResults(rows) {
      resultsEl.replaceChildren();
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = cleanString(searchInput.value) ? 'No matching results found.' : 'Enter a search term to find results.';
        resultsEl.appendChild(empty);
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const row of rows.slice(0, 100)) {
        const item = displayText(row);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'result';
        const title = document.createElement('span');
        title.className = 'result-title';
        title.textContent = item.title;
        button.appendChild(title);
        if (item.url) {
          const linkText = document.createElement('span');
          linkText.className = 'result-url';
          linkText.textContent = item.url;
          button.appendChild(linkText);
          button.addEventListener('click', () => { window.location.assign(item.url); });
        } else {
          button.disabled = true;
          button.title = 'No valid HTTP(S) link is available for this result.';
        }
        fragment.appendChild(button);
      }
      resultsEl.appendChild(fragment);
      if (rows.length > 100) {
        const note = document.createElement('p');
        note.className = 'status';
        note.textContent = 'Showing the first 100 matches. Refine your search to see more specific results.';
        resultsEl.appendChild(note);
      }
    }

    function filterData() {
      const query = cleanString(searchInput.value).toLocaleLowerCase();
      if (!query) { renderResults([]); return; }
      const matches = csvData.filter(row =>
        row.some(cell => !/^https?:\/\//i.test(cell.trim()) && cell.toLocaleLowerCase().includes(query))
      );
      renderResults(matches);
      statusEl.textContent = matches.length
        ? matches.length + ' matching row' + (matches.length === 1 ? '' : 's') + (matches.length > 100 ? ' (showing 100)' : '') + '.'
        : 'No results for “' + cleanString(searchInput.value) + '”.';
    }

    function updateURLQuery(query) {
      const url = new URL(window.location.href);
      const value = cleanString(query);
      url.searchParams.delete('Q');
      if (value) url.searchParams.set('q', value);
      else url.searchParams.delete('q');
      window.history.replaceState(null, '', url.pathname + url.search + url.hash);
    }

    function restoreURLQuery() {
      // URL parameter names are normally case-sensitive in URLSearchParams.
      // Accept q, Q, and other casing variants (for example ?Q=hello).
      const params = new URLSearchParams(window.location.search);
      let query = '';
      for (const [key, value] of params.entries()) {
        if (key.toLowerCase() === 'q') {
          query = value;
          if (key === 'q') break; // Prefer the canonical lowercase parameter if both exist.
        }
      }
      searchInput.value = query;
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        filterData();
        updateURLQuery(searchInput.value);
      }, 100);
    });

    async function loadData() {
      try {
        const response = await fetch(csvUrl.href, { cache: 'no-cache' });
        if (!response.ok) throw new Error('DATA.CSV returned HTTP ' + response.status + '.');
        const text = await response.text();
        const rows = parseCSV(text);
        if (!rows.length) throw new Error('DATA.CSV is empty or could not be parsed.');
        // Treat the first non-empty row as the CSV header.
        csvData = rows.slice(1).filter(row => row.some(Boolean));
        if (!csvData.length) throw new Error('DATA.CSV contains a header but no data rows.');
        restoreURLQuery();
        searchInput.disabled = false;
        filterData();
        statusEl.textContent = 'Loaded ' + csvData.length + ' rows. Type to search.';
        if (searchInput.value) filterData();
      } catch (error) {
        statusEl.textContent = 'Could not load search data: ' + error.message + ' Check that DATA.CSV exists beside index.html and is accessible.';
        statusEl.style.color = '#a12d2d';
        resultsEl.replaceChildren();
      }
    }
    loadData();
  </script>
</body>
</html>
