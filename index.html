<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandstorm Search</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;background:linear-gradient(135deg,#f3ede2,#e7decb);color:#4a3e3d;font-family:system-ui,-apple-system,sans-serif}
    .container{max-width:760px;margin:40px auto;background:#fffdf9;padding:28px 24px;border-radius:16px;box-shadow:0 12px 40px #87785f26;border:1px solid #e8dec9}
    h1{font-size:26px;color:#705e49;margin:0 0 16px}
    .status{color:#8c7b64;margin:0 0 16px;font-size:14px}
    input{width:100%;padding:14px 16px;margin-bottom:18px;border:1px solid #d9ccb4;border-radius:10px;font-size:16px;background:#faf7f0;color:#4a3e3d}
    input:focus{outline:2px solid #bfae93;outline-offset:1px}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{border:1px solid #ebdcb9;padding:13px 14px;text-align:left;overflow-wrap:anywhere}
    th{background:#efe6cf;color:#61503b;font-size:13px;text-transform:uppercase}
    tbody tr{cursor:pointer}tbody tr:hover{background:#f3ebda}
    .empty{color:#8c7b64;text-align:center;cursor:default}
    @media(max-width:480px){.container{margin:8px auto;padding:20px 14px}h1{font-size:23px}}
  </style>
</head>
<body>
  <main class="container">
    <h1>Sandstorm Search</h1>
    <p id="status" class="status" role="status">Loading search data…</p>
    <form id="searchForm">
      <input id="searchInput" type="search" placeholder="Type a search and press Enter…" aria-label="Search data" autocomplete="off">
    </form>
    <table>
      <thead><tr><th>Search results</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </main>
<script>
  const csvUrl = './DATA.CSV';
  const searchInput = document.getElementById('searchInput');
  const searchForm = document.getElementById('searchForm');
  const statusEl = document.getElementById('status');
  const tableBody = document.getElementById('tableBody');
  let csvData = [];

  function getQueryParameter() {
    const params = new URLSearchParams(window.location.search);
    // URLSearchParams keys are case-sensitive, so explicitly accept q, Q, or any casing.
    for (const [key, value] of params.entries()) {
      if (key.toLowerCase() === 'q' && value.trim()) return value.trim();
    }
    return '';
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
        else quoted = !quoted;
      } else if (ch === ',' && !quoted) {
        row.push(cell.trim()); cell = '';
      } else if ((ch === '\n' || ch === '\r') && !quoted) {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell.trim()); cell = '';
        if (row.some(value => value !== '')) rows.push(row);
        row = [];
      } else cell += ch;
    }
    row.push(cell.trim());
    if (row.some(value => value !== '')) rows.push(row);
    return rows;
  }

  function extractUrl(row) {
    for (const value of row) {
      const match = value.match(/https?:\/\/[^\s"'<>|,]+/i);
      if (match) {
        try {
          const url = new URL(match[0]);
          if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
        } catch (_) {}
      }
    }
    return null;
  }

  function showResults(results) {
    tableBody.replaceChildren();
    if (!results.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.className = 'empty';
      td.textContent = searchInput.value.trim() ? 'No matching results found.' : 'Enter a search term to begin.';
      tr.appendChild(td); tableBody.appendChild(tr);
      return;
    }
    for (const result of results.slice(0, 100)) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      const words = result.text.split(/\s+/);
      td.textContent = words.length > 10 ? words.slice(0, 10).join(' ') + '…' : result.text;
      tr.appendChild(td);
      const url = extractUrl(result.row);
      if (url) {
        tr.title = 'Open result';
        tr.addEventListener('click', () => { window.location.href = url; });
      } else {
        tr.style.cursor = 'default';
      }
      tableBody.appendChild(tr);
    }
  }

  function filterData() {
    const query = searchInput.value.trim().toLocaleLowerCase();
    if (!query) { showResults([]); return; }
    const results = [];
    for (const row of csvData) {
      for (const cell of row) {
        if (/https?:\/\//i.test(cell)) continue;
        if (cell.toLocaleLowerCase().includes(query)) results.push({text:cell,row});
      }
    }
    showResults(results);
    statusEl.textContent = results.length + ' matching result' + (results.length === 1 ? '' : 's') + '.';
  }

  searchForm.addEventListener('submit', event => {
    event.preventDefault();
    const url = new URL(window.location.href);
    const query = searchInput.value.trim();
    url.searchParams.delete('Q');
    if (query) url.searchParams.set('q', query);
    else url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
    filterData();
  });

  // Populate the input immediately, before the CSV request finishes.
  searchInput.value = getQueryParameter();

  fetch(csvUrl)
    .then(response => {
      if (!response.ok) throw new Error('Could not load DATA.CSV (HTTP ' + response.status + ').');
      return response.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      csvData = rows.length > 1 ? rows.slice(1) : rows;
      statusEl.textContent = 'Search data loaded.';
      if (searchInput.value.trim()) filterData();
      else showResults([]);
    })
    .catch(error => {
      statusEl.textContent = error.message;
      statusEl.style.color = '#b33939';
    });
</script>
</body>
</html>
