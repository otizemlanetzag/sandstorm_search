<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Search Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f7f4eb; /* Soft sand background */
            color: #4a3e3d; /* Dark brown-gray text */
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fffdf9; /* Warm cream container background */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(180, 165, 140, 0.15); /* Soft sandy shadow */
            border: 1px solid #e8dec9;
        }
        h2 {
            color: #705e49; /* Earthy brown for headings */
            margin-top: 0;
            margin-bottom: 20px;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #d9ccb4;
            border-radius: 6px;
            font-size: 16px;
            background-color: #faf7f0;
            color: #4a3e3d;
            outline: none;
            text-align: left; /* Left align text input */
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #bfae93;
            box-shadow: 0 0 5px rgba(191, 174, 147, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ebdcb9;
            padding: 14px;
            text-align: left; /* Aligned left for English */
        }
        th {
            background-color: #efe6cf; /* Soft sand table header */
            color: #61503b;
            font-weight: bold;
        }
        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        tbody tr:hover {
            background-color: #f3ebda; 
        }
        .status {
            color: #8c7b64;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Search Data from CSV</h2>
    <div id="status" class="status">Loading data...</div>
    
    <input type="text" id="searchInput" placeholder="Type here to search..." disabled>
    
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Search Results</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const csvUrl = 'DATA.CSV'; // Path to your CSV file
    let csvData = [];

    // Function to parse a CSV row into an array
    function parseCSVRow(text) {
        let p = '', r = [];
        let q = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { q = !q; }
            else if (c === ',' && !q) { r.push(p.trim()); p = ''; }
            else { p += c; }
        }
        r.push(p.trim());
        return r;
    }

    // Traditional 10-word text limiter
    function limitToTenWords(text) {
        const words = text.split(/\s+/).filter(w => w.length > 0);
        if (words.length > 10) {
            return words.slice(0, 10).join(' ') + '...';
        }
        return text;
    }

    // Function to check if a cell contains a URL or Wikipedia link
    function containsUrl(text) {
        const lowerText = text.toLowerCase();
        return lowerText.includes('http://') || 
               lowerText.includes('https://') || 
               lowerText.includes('wikipedia.org') ||
               lowerText.includes('.org') ||
               lowerText.includes('.com');
    }

    // Function to extract the actual URL from a complex cell (e.g., after the '|')
    function extractRealUrl(text) {
        if (text.includes('|')) {
            const parts = text.split('|');
            const urlPart = parts.find(p => p.includes('http://') || p.includes('https://') || p.includes('wikipedia.org'));
            if (urlPart) return urlPart.trim();
        }
        return text.trim();
    }

    // Fetch CSV file from server
    fetch(csvUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error('Unable to find DATA.CSV or permission error occurred');
            }
            return response.text();
        })
        .then(text => {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return;

            // Save data excluding the first header row
            csvData = lines.slice(1).map(line => parseCSVRow(line));

            // Enable search input
            document.getElementById('status').innerText = `Data loaded successfully. Type to start searching.`;
            const searchInput = document.getElementById('searchInput');
            searchInput.disabled = false;
            searchInput.addEventListener('input', filterData);
        })
        .catch(error => {
            document.getElementById('status').innerText = 'Error: ' + error.message;
            document.getElementById('status').style.color = '#b33939'; 
        });

    // Render matched cells into the table
    function renderResults(results) {
        const body = document.getElementById('tableBody');
        body.innerHTML = ''; 
        
        if (results.length === 0) {
            body.innerHTML = `<tr><td style="text-align:center; color:#a69580;">No matching results found</td></tr>`;
            return;
        }
        
        results.forEach(item => {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            
            td.textContent = limitToTenWords(item.matchedText); 
            tr.appendChild(td);
            
            // Extract the URL and navigate on click
            tr.addEventListener('click', () => {
                const rawUrlCell = item.originalRow.find(cell => containsUrl(cell));
                if (rawUrlCell) {
                    const finalUrl = extractRealUrl(rawUrlCell);
                    window.location.href = finalUrl;
                } else {
                    alert('No valid link found for this result');
                }
            });
            
            body.appendChild(tr);
        });
    }

    // Filter cells while hiding link/URL cells from results
    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        
        if (query === '') {
            renderResults([]);
            return;
        }
        
        const matchedItems = [];
        
        csvData.forEach(row => {
            row.forEach((cell) => {
                // Block URLs from appearing as text search results
                if (containsUrl(cell)) return; 

                if (cell.toLowerCase().includes(query)) {
                    matchedItems.push({
                        matchedText: cell,   
                        originalRow: row     
                    });
                }
            });
        });
        
        renderResults(matchedItems);
    }
</script>

</body>
</html>
